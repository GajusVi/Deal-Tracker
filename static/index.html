<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="view-transition" content="same-origin">
  <title>Deal Tracker</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230e0f12'/><text x='32' y='43' text-anchor='middle' font-family='Georgia,serif' font-size='32' fill='white'>D</text></svg>">
  <link rel="preload" href="/static/fonts/source-serif-4.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/css/app.css">
  <script>
    try { const t = localStorage.getItem('dt-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/">
        <span class="brand-mark" id="brand-mark" aria-hidden="true">D</span>
        <span class="brand-text"><strong>Deal Tracker</strong><small id="firm-name">Private equity</small></span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="#/" data-route="dashboard"><i data-icon="overview"></i>Overview<span class="badge" id="attn-badge" hidden></span></a>
        <a href="#/pipeline" data-route="pipeline"><i data-icon="pipeline"></i>Pipeline<kbd>G P</kbd></a>
        <a href="#/companies" data-route="companies"><i data-icon="companies"></i>Companies<kbd>G C</kbd></a>
        <a href="#/meetings" data-route="meetings"><i data-icon="meetings"></i>Meetings<kbd>G M</kbd></a>
        <div class="nav-label">Relationships</div>
        <a href="#/contacts" data-route="contacts"><i data-icon="contacts"></i>Contacts<kbd>G R</kbd></a>
        <a href="#/network" data-route="network"><i data-icon="network"></i>Network<kbd>G N</kbd></a>
        <div class="nav-label">Firm memory</div>
        <a href="#/team" data-route="team"><i data-icon="team"></i>Team &amp; handover<kbd>G T</kbd></a>
      </nav>
      <div class="nav-bottom">
        <a href="#/settings" data-route="settings"><i data-icon="settings"></i>Settings</a>
        <button id="shortcuts-btn" type="button"><i data-icon="keyboard"></i>Shortcuts<kbd style="margin-left:auto">?</kbd></button>
        <button class="theme-toggle" id="theme-toggle" type="button"><i data-icon="moon"></i><span>Dark mode</span></button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar" id="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Menu"><i data-icon="menu"></i></button>
        <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
        <button class="cmdk-trigger" id="cmdk-trigger" type="button"><i data-icon="search"></i><span>Search or jump to…</span><kbd id="cmdk-kbd">⌘K</kbd></button>
        <div class="quick-add">
          <button class="btn primary sm" id="quick-add-btn"><i data-icon="plus"></i>New</button>
          <div class="menu" id="quick-add-menu" hidden>
            <button data-new="company"><i data-icon="companies"></i><span>Company</span><kbd>C</kbd></button>
            <button data-new="cim"><i data-icon="scan"></i><span>Company from CIM</span><kbd>U</kbd></button>
            <button data-new="meeting"><i data-icon="meetings"></i><span>Meeting notes</span><kbd>M</kbd></button>
            <button data-new="contact"><i data-icon="userPlus"></i><span>Contact</span></button>
          </div>
        </div>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toasts" aria-live="polite"></div>
  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
